<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retry Proxy · live</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3240;
    --fg:#e6edf3; --mut:#8b98a9; --dim:#5d6b7e;
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --info:#58a6ff; --purple:#bc8cff;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
  h1{font-size:16px;font-weight:650;margin:0}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill.ok .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.18)}
  .pill.warn .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(210,153,34,.18)}
  .pill.err .dot{background:var(--err);box-shadow:0 0 0 3px rgba(248,81,73,.18)}
  .meta{color:var(--mut);font-size:12px;font-family:var(--mono)}
  main{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
    margin:0 0 8px;font-weight:600}
  .kpis{grid-column:span 12;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .kpi .n{font:600 22px/1.2 var(--mono);letter-spacing:-.02em}
  .kpi .l{color:var(--mut);font-size:11px;margin-top:3px}
  .kpi.bad .n{color:var(--err)} .kpi.warn .n{color:var(--warn)} .kpi.good .n{color:var(--ok)}
  .chart{grid-column:span 8}
  .classes{grid-column:span 4}
  .ctrls{grid-column:span 5}
  .feed{grid-column:span 7}
  .events{grid-column:span 12}
  canvas{width:100%;height:150px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;
    border-bottom:1px dashed rgba(255,255,255,.05)}
  .row:last-child{border-bottom:0}
  .row .k{font-family:var(--mono);font-size:12px;color:var(--mut)}
  .row .v{font-family:var(--mono);font-size:12px}
  .bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;background:var(--info);border-radius:4px}
  .cls{margin-bottom:9px}
  .cls .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px}
  .ctl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:6px 8px;font:12px var(--mono);min-width:0}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:7px 11px;font:600 12px system-ui;cursor:pointer}
  button:hover{border-color:#3d4757;background:#232b39}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.primary:hover{background:#388bfd}
  button.danger{color:#ffb3ad;border-color:#5b2b2b}
  button.danger:hover{background:#3a1d1d}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  table{width:100%;border-collapse:collapse;font:12px var(--mono)}
  th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--mut);
    font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:700}
  .tag.OK{background:rgba(63,185,80,.15);color:var(--ok)}
  .tag.IP_REP{background:rgba(210,153,34,.16);color:var(--warn)}
  .tag.EMPTY_STREAM,.tag.RATE{background:rgba(188,140,255,.16);color:var(--purple)}
  .tag.IDENTITY,.tag.CF_UA,.tag.ERR{background:rgba(248,81,73,.15);color:var(--err)}
  .tag.HTTP4{background:rgba(88,166,255,.15);color:var(--info)}
  .scroll{max-height:300px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
    background:#1f2937;border:1px solid var(--line);border-radius:9px;padding:9px 14px;
    font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .chart,.classes,.ctrls,.feed{grid-column:span 12}
  }
  @media (max-width:420px){ .kpis{grid-template-columns:repeat(2,1fr)} .wrap{padding:12px 10px 30px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Retry Proxy</h1>
    <span class="pill" id="health"><span class="dot"></span><span id="healthText">…</span></span>
    <span class="meta" id="ver">v…</span>
    <span class="meta" id="where">127.0.0.1:8787</span>
    <span class="meta" id="uptime"></span>
    <span class="meta" id="pid"></span>
    <span style="flex:1"></span>
    <button id="pauseBtn">暂停重试</button>
    <button id="restartBtn" class="primary">零停机重启</button>
  </header>

  <main>
    <section class="kpis">
      <div class="kpi"><div class="n" id="k-requests">0</div><div class="l">请求</div></div>
      <div class="kpi good"><div class="n" id="k-rescue">–</div><div class="l">救回率</div></div>
      <div class="kpi warn"><div class="n" id="k-retried">0</div><div class="l">需要重试</div></div>
      <div class="kpi bad"><div class="n" id="k-failed">0</div><div class="l">失败</div></div>
      <div class="kpi" id="kpi-iprep"><div class="n" id="k-iprep">0%</div><div class="l">IP 信誉占比</div></div>
      <div class="kpi warn"><div class="n" id="k-trunc">0</div><div class="l">SSE 截断</div></div>
    </section>

    <section class="card chart">
      <h2>最近 3 分钟</h2>
      <canvas id="chart" width="800" height="150"></canvas>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>一次成功</span>
        <span><i style="background:var(--warn)"></i>重试后成功</span>
        <span><i style="background:var(--err)"></i>仍失败</span>
      </div>
    </section>

    <section class="card classes">
      <h2>尝试分类</h2>
      <div id="classList" class="meta">暂无数据</div>
    </section>

    <section class="card ctrls">
      <h2>手动介入</h2>
      <div class="ctl-grid">
        <label class="f">最大尝试次数
          <input id="f-attempts" type="number" min="1" max="10" step="1" />
        </label>
        <label class="f">超时（秒）
          <input id="f-timeout" type="number" min="5" max="900" step="5" />
        </label>
        <label class="f">上游线路
          <select id="f-route">
            <option value="">跟随自动</option>
            <option value="proxy">强制走 Clash</option>
            <option value="direct">强制直连</option>
          </select>
        </label>
        <label class="f">退避序列（秒，逗号分隔）
          <input id="f-backoff" type="text" placeholder="0.4,1.0,1.8" />
        </label>
      </div>
      <div class="btnrow">
        <button class="primary" id="applyBtn">应用</button>
        <button id="resetBtn">清零计数</button>
        <button class="danger" id="shutdownBtn">停止代理</button>
      </div>
      <div class="row" style="margin-top:10px"><span class="k">上游</span><span class="v" id="v-upstream"></span></div>
      <div class="row"><span class="k">代理</span><span class="v" id="v-proxy"></span></div>
      <div class="row"><span class="k">状态</span><span class="v" id="v-state"></span></div>
    </section>

    <section class="card feed">
      <h2>诊断</h2>
      <div class="row"><span class="k">总尝试 / 请求</span><span class="v" id="d-att"></span></div>
      <div class="row"><span class="k">重试后仍失败</span><span class="v" id="d-exh"></span></div>
      <div class="row"><span class="k">最近事件</span><span class="v" id="d-last"></span></div>
      <div class="btnrow">
        <button id="copyBtn">复制诊断 JSON</button>
        <button id="rawBtn">打开 /__stats</button>
      </div>
    </section>

    <section class="card events">
      <h2>实时请求</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>时间</th><th>模型</th><th>尝试</th><th>耗时</th><th>字节</th><th>线路</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="meta">等待第一个请求…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let last = null, paused = false, events = [], live = [];
let buckets = new Map(); // bucketIndex -> {ok,retried,failed}
const BUCKET_MS = 2000, SPAN = 90;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

async function api(path, opts){
  const r = await fetch(path, Object.assign({cache:'no-store'}, opts||{}));
  if(!r.ok) throw new Error(path+' -> '+r.status);
  return r.json();
}

function fmtUptime(s){
  s = Math.max(0, Math.round(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+'h ':'')+(h||m?m+'m ':'')+x+'s';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clsTag(c){
  const k = /^HTTP/.test(c) ? 'HTTP4' : c;
  return '<span class="tag '+k+'">'+esc(c)+'</span>';
}

function renderStats(s){
  last = s;
  const set = (id,v)=>{ const el=$(id); if(el) el.textContent=v; };
  set('k-requests', s.requests ?? 0);
  set('k-retried', s.retried_requests ?? 0);
  set('k-failed', s.failed_requests ?? 0);
  set('k-trunc', s.truncated_streams ?? 0);
  const rescued = s.rescued_requests || 0, retried = s.retried_requests || 0;
  set('k-rescue', retried ? Math.round(rescued/retried*100)+'%' : '–');

  let attempts=0, iprep=0;
  for(const [k,v] of Object.entries(s.classes||{})){ attempts+=v; if(k==='IP_REP') iprep=v; }
  set('k-iprep', attempts ? (iprep/attempts*100).toFixed(1)+'%' : '0%');

  const where = 'http://'+(s.port||8787)+'/__ui';
  $('where').textContent = where;
  $('uptime').textContent = 'up '+fmtUptime(s.uptime_s||0);
  $('pid').textContent = 'pid '+(s.pid||'?');
  set('v-upstream', s.upstream||'');
  set('v-proxy', s.upstream_proxy||'直连');
  set('d-att', (s.attempts??0)+' / '+(s.requests??0));
  set('d-exh', s.exhausted_requests??0);
  paused = !!(s.settings && s.settings.paused);
  $('pauseBtn').textContent = paused ? '恢复重试' : '暂停重试';
  $('pauseBtn').classList.toggle('primary', paused);
  set('v-state', paused ? '已暂停（只透传，不重试）' : '正常');

  const st = s.settings||{};
  if(document.activeElement !== $('f-attempts')) $('f-attempts').value = st.attempts ?? '';
  if(document.activeElement !== $('f-timeout')) $('f-timeout').value = st.timeout ?? '';
  if(document.activeElement !== $('f-backoff')) $('f-backoff').value = (st.backoff||[]).join(',');
  $('f-route').value = st.force_route || '';

  // class bars
  const cl = s.classes||{};
  const total = Object.values(cl).reduce((a,b)=>a+b,0) || 1;
  const order = Object.entries(cl).sort((a,b)=>b[1]-a[1]);
  $('classList').innerHTML = order.length ? order.map(([k,v])=>{
    const pct = v/total*100;
    const color = k==='OK' ? 'var(--ok)' : k==='IP_REP' ? 'var(--warn)' : 'var(--err)';
    return '<div class="cls"><div class="top"><span>'+esc(k)+'</span><span>'+v+' · '+pct.toFixed(1)+'%</span></div>'+
      '<div class="bar"><i style="width:'+pct.toFixed(1)+'%;background:'+color+'"></i></div></div>';
  }).join('') : '<span class="meta">暂无数据</span>';

  // health pill
  const hp=$('health'), ht=$('healthText');
  hp.className='pill '+(s.failed_requests>0?'warn':'ok');
  ht.textContent = paused ? '已暂停' : (s.failed_requests>0 ? '有失败' : '在线');
  const ver=$('ver'); if(ver) ver.textContent='v'+(s.version||'?');
}

function addEvent(ev){
  live.unshift(ev); live = live.slice(0,60);
  const tr = (ev.attempts||[]);
  const ok = tr.length && tr[tr.length-1]==='OK';
  const failed = tr.length && tr[tr.length-1]!=='OK';
  const b = Math.floor(Date.now()/BUCKET_MS);
  const cur = buckets.get(b) || {ok:0,retried:0,failed:0};
  if(failed) cur.failed++; else if(tr.length>1) cur.retried++; else if(ok) cur.ok++;
  buckets.set(b,cur);
  for(const k of buckets.keys()) if(k < b-SPAN) buckets.delete(k);
  drawChart();
  renderRows();
}
function renderRows(){
  if(!live.length){ $('rows').innerHTML='<tr><td colspan="6" class="meta">等待第一个请求…</td></tr>'; return; }
  $('rows').innerHTML = live.map(ev=>{
    const t=(ev.ts||'').replace('T',' ').slice(5);
    const trail=(ev.attempts||[]).map(clsTag).join(' ');
    const ms=ev.ms!=null ? ev.ms+'ms' : '';
    const bytes=ev.body_len!=null ? ev.body_len : '';
    const route=ev.route==='direct' ? '直连' : 'Clash';
    return '<tr><td>'+esc(t)+'</td><td title="'+esc(ev.model||'')+'">'+esc(ev.model||'')+'</td><td>'+trail+
      '</td><td>'+ms+'</td><td>'+bytes+'</td><td>'+route+'</td></tr>';
  }).join('');
  if(live[0]) $('d-last').textContent = (live[0].ts||'').replace('T',' ')+' · '+(live[0].model||'');
}

function drawChart(){
  const c=$('chart'), ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth, h=150;
  if(c.width!==w*dpr){ c.width=w*dpr; c.height=h*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const now=Math.floor(Date.now()/BUCKET_MS);
  const series=[];
  for(let i=SPAN-1;i>=0;i--){ const b=now-i; series.push(buckets.get(b)||{ok:0,retried:0,failed:0}); }
  const max=Math.max(1,...series.map(s=>s.ok+s.retried+s.failed));
  const bw=w/SPAN;
  series.forEach((s,i)=>{
    let y=h-4;
    const tot=s.ok+s.retried+s.failed;
    const seg=(n,color)=>{ if(!n) return; const ph=(n/max)*(h-8); y-=ph;
      ctx.fillStyle=color; ctx.fillRect(i*bw+0.5, y, Math.max(1,bw-1.4), ph); };
    seg(s.ok,'#3fb950'); seg(s.retried,'#d29922'); seg(s.failed,'#f85149');
    if(tot===0){ ctx.fillStyle='rgba(255,255,255,.04)'; ctx.fillRect(i*bw+0.5,h-3,Math.max(1,bw-1.4),2); }
  });
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(0,h-1,w,1);
}

async function load(){
  try{
    const s = await api('/__stats');
    renderStats(s);
  }catch(e){
    $('health').className='pill err'; $('healthText').textContent='代理无响应';
    $('v-state').textContent='连接失败：'+e.message;
  }
}

async function control(payload){
  const r = await fetch('/__control',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(payload)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.ok===false) throw new Error(j.error||('HTTP '+r.status));
  await load();
  return j;
}

$('pauseBtn').onclick = async ()=>{
  try{ await control({action: paused?'resume':'pause'}); toast(paused?'已恢复重试':'已暂停重试'); }
  catch(e){ toast('失败：'+e.message); }
};
$('applyBtn').onclick = async ()=>{
  const attempts=Number($('f-attempts').value||0);
  const timeout=Number($('f-timeout').value||0);
  const backoff=$('f-backoff').value.split(',').map(x=>Number(x.trim())).filter(x=>x>0);
  const route=$('f-route').value;
  try{
    await control({action:'set', attempts, timeout, backoff, force_route: route||null});
    toast('已应用');
  }catch(e){ toast('失败：'+e.message); }
};
$('resetBtn').onclick = async ()=>{ try{ await control({action:'reset'}); toast('计数已清零'); }catch(e){ toast('失败：'+e.message); } };
$('restartBtn').onclick = async ()=>{
  if(!confirm('零停机热切换：新实例先接管 8787，再退出旧实例。继续？')) return;
  try{ await control({action:'restart'}); toast('已发起热切换'); setTimeout(load, 2500); }
  catch(e){ toast('失败：'+e.message); }
};
$('shutdownBtn').onclick = async ()=>{
  if(!confirm('停止代理会让 OpenCode 立刻报 ConnectionRefused（计划任务一分钟内会拉起）。继续？')) return;
  try{ await control({action:'shutdown'}); toast('已停止'); }
  catch(e){ toast('失败：'+e.message); }
};
$('copyBtn').onclick = async ()=>{
  try{
    const s = await api('/__stats');
    const text = JSON.stringify({stats:s, lastEvents:live.slice(0,20)}, null, 2);
    await navigator.clipboard.writeText(text);
    toast('诊断 JSON 已复制');
  }catch(e){ toast('复制失败：'+e.message); }
};
$('rawBtn').onclick = ()=> window.open('/__stats','_blank');

function connect(){
  try{
    const es = new EventSource('/__events');
    es.onmessage = (m)=>{ try{ addEvent(JSON.parse(m.data)); }catch(e){} };
    es.onerror = ()=>{ es.close(); setTimeout(connect, 6000); };
  }catch(e){ setTimeout(connect, 6000); }
}

load();
setInterval(load, 2000);
connect();
drawChart();
setInterval(drawChart, 2000);
</script>
</body>
</html>
